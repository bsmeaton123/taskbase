# Single-server deployment (e.g. a Hostinger VPS): Postgres, taskbase, Caddy for
# HTTPS, and nightly backups. See deploy/HOSTINGER.md for the full walkthrough.
#   cp .env.example .env   (fill in DOMAIN, POSTGRES_PASSWORD, BETTER_AUTH_SECRET, ...)
#   docker compose up -d --build

# Fixed project name, so volumes are called taskbase_* whatever the folder is named.
name: taskbase

# Docker keeps container logs forever by default; cap them so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: digibooth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: digibooth
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digibooth"]
      interval: 5s
      retries: 10
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://digibooth:${POSTGRES_PASSWORD}@db:5432/digibooth
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    # No published ports: only Caddy talks to the app. (Ports published by Docker skip
    # the server's firewall, so publishing 3000 would expose plain HTTP to the internet.)
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. tasks.yourcompany.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  backup:
    build: ./deploy/backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Deliberately no env_file: the backup container only gets what it needs, not the
    # auth secret or API keys. Add RCLONE_CONFIG_* lines here if you set up an off-site copy.
    environment:
      PGHOST: db
      PGUSER: digibooth
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: digibooth
      TZ: ${BACKUP_TZ:-UTC}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      SLACK_ALERTS_WEBHOOK_URL: ${SLACK_ALERTS_WEBHOOK_URL:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    logging: *logging

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
